[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "botw-companion"
dynamic = ["version"]
description = "Local Breath of the Wild save analysis and completion tracking for Ryujinx and Cemu."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "BOTW Companion contributors"}]
dependencies = ["certifi==2025.8.3", "fluent.runtime==0.4.0", "fluent.syntax==0.19.0", "Babel==2.17.0", "attrs==25.3.0", "pytz==2025.2", "typing_extensions==4.15.0"]

[project.scripts]
botw-companion = "botw_companion.cli:main"
botw-companion-windows = "botw_companion.windows_launcher:main"

[tool.setuptools.package-data]
botw_companion = [
    "VERSION",
    "macos_update_relay.sh",
    "data/*.json",
    "i18n/*.json",
    "locales/*.json",
    "locales/*/locale.json",
    "locales/*/contract.json",
    "locales/*/presentation-data.json",
    "locales/*/*.ftl",
    "locales/*/*.html",
    "locales/*/*.js",
    "web/*.html",
    "web/*.css",
    "web/*.js",
    "web/*.webp",
    "web/map-tiles/*.json",
    "web/map-tiles/*.txt",
    "web/map-tiles/*/*.webp",
    "dsu/*.md",
    "dsu/macos/*",
    "dsu/windows/*.exe",
    "dsu/windows/*.dll",
    "dsu/windows/*.json",
    "dsu/windows/*.txt",
]

[tool.setuptools.dynamic]
version = {file = ["botw_companion/VERSION"]}

[tool.setuptools.packages.find]
include = ["botw_companion*"]
exclude = ["tests*", "tools*"]

[tool.setuptools]
license-files = ["LICENSE", "licenses/*.txt", "THIRD_PARTY_NOTICES.md", "DATA_SOURCES.md"]
