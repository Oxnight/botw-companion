name: Windows autonome

on:
  push:
    branches: [master]
    tags: ["v0.40.0-alpha.23"]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Compiler et tester Windows x64
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Installer Python 3.12 x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip

      - name: Vérifier la version
        shell: pwsh
        run: |
          $arguments = @("tools/check_version_consistency.py")
          if ("${{ github.ref }}" -like "refs/tags/*") {
            $arguments += @("--tag", "${{ github.ref_name }}")
          }
          python @arguments

      - name: Tester le code Python et le paquet
        run: python -m unittest discover -s tests -v

      - name: Préparer les navigateurs
        run: |
          npm ci --ignore-scripts
          npx playwright install firefox

      - name: Tester Chrome, Edge et Firefox
        shell: pwsh
        run: ./tools/run_browser_smoke.ps1

      - name: Installer Inno Setup officiel vérifié
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/install_inno_setup_ci.ps1

      - name: Construire l'application et l'installateur
        shell: pwsh
        run: ./tools/build_windows_app.ps1

      - name: Tester l'installation autonome
        shell: pwsh
        run: ./tools/test_windows_installation.ps1

      - name: Vérifier l'empreinte publiée
        shell: pwsh
        run: |
          $line = Get-Content "dist/installer/SHA256SUMS.txt"
          $expected = ($line -split "\s+")[0]
          $actual = (Get-FileHash -Algorithm SHA256 "dist/installer/BOTW_Companion_0.40.0-alpha.23_Setup.exe").Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Empreinte SHA-256 invalide." }

      - name: Conserver les livrables Windows
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: BOTW-Companion-0.40.0-alpha.23-Windows-x64
          path: |
            dist/installer/BOTW_Companion_0.40.0-alpha.23_Setup.exe
            dist/installer/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish-release:
    name: Publier la préversion GitHub
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Télécharger les livrables validés
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: BOTW-Companion-0.40.0-alpha.23-Windows-x64
          path: release-assets

      - name: Revalider l'empreinte
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt

      - name: Créer la GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          release-assets/BOTW_Companion_0.40.0-alpha.23_Setup.exe
          release-assets/SHA256SUMS.txt
          --verify-tag
          --prerelease
          --title "BOTW Companion 0.40.0 alpha 23 — Windows"
          --notes-file windows/RELEASE_NOTES_0.40.0-alpha.23.md
